# Copy to the application repository as .deploy/manifest.yaml before release.
# Schema version, NOT release version. Never put secret values in this file.
version: 1

application:
  name: myapp

server:
  deploy_path: /opt/apps/myapp

docker:
  compose_file: compose.yaml
  # Base image name only. Compose must use myapp:${APP_VERSION}.
  image: myapp

environment:
  # Existing file outside repository; deployment never creates or overwrites it.
  file: /opt/apps/myapp/shared/.env
  required:
    - DATABASE_URL

directories:
  required:
    - /data/myapp

verify:
  services:
    - app
  directories:
    - /data/myapp
  health:
    url: http://127.0.0.1:3000/health
    status: 200
